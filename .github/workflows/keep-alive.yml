name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days without user DB activity.
# This reads a tiny RLS-protected table with the ANON key twice a week to keep
# the project active. Set up the DB side with
# supabase/migrations/20261016203929_keep_alive.sql.

on:
  schedule:
    # 06:00 UTC every Monday and Thursday — twice weekly, comfortably under the
    # 7-day window (GitHub cron is UTC and best-effort).
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Missing secrets must fail loudly: a silently skipped ping lets the
          # free-tier project pause unnoticed.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set; the project will pause after 7 days."
            exit 1
          fi
          # --fail: non-2xx fails the step (alerts you). -o /dev/null: never
          # print body/headers so the key cannot leak (GitHub also masks it).
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Keep-alive ping OK."

# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co   (Project Settings → API)
#   SUPABASE_ANON_KEY  the anon / publishable key          (RLS-gated, safe to use here)
# Do NOT use the service_role / secret key — it bypasses RLS and is not needed.
