name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Must run before setup-node so `cache: pnpm` can locate the store.
      # No `version` input — it reads the packageManager field from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `nuxt prepare`, generating .nuxt/ types and the
      # eslint config that lint/typecheck depend on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
