name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node so `cache: pnpm` can locate the store.
      # No `version` input — it reads the packageManager field from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `nuxt prepare`, generating .nuxt/ types and the
      # eslint config that lint/typecheck depend on.
      - run: pnpm install --frozen-lockfile

      # App/server/shared via nuxt typecheck, plus the CLI scripts and unit tests (tsconfig.scripts.json).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Fails on critical advisories only; the accepted ones are listed, with
      # reasons, in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level critical

  # The production bundle: builds, boots without secrets, and serves what
  # dev mode hides — bundled PDF.js data files, security headers, and the
  # routes refusing politely when unconfigured.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test the built server
        shell: bash
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          set -euxo pipefail
          # Page renders, with no COEP header at all: any COEP (also nuxt-security's
          # default `credentialless`) blocks the PDF.js worker (TECH_NOTES §11).
          curl -sf -D headers.txt -o /dev/null http://localhost:3000/
          if grep -qi '^cross-origin-embedder-policy:' headers.txt; then echo 'COEP header present' >&2; exit 1; fi
          # PDF.js data files for the browser viewer.
          curl -sf -o /dev/null http://localhost:3000/pdfjs/cmaps/UniJIS-UTF16-H.bcmap
          curl -sf -o /dev/null http://localhost:3000/pdfjs/standard_fonts/FoxitSerif.pfb
          curl -sf -o /dev/null http://localhost:3000/pdfjs/wasm/openjpeg.wasm
          # Ingestion is disabled without a token: 503 before reading the body.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-length: 10' --data 0123456789 http://localhost:3000/api/ingest)" = 503
      - if: failure()
        run: cat server.log

  # The production target (Phase 14, ADR-0011): the same app built with Nitro's
  # vercel preset into .vercel/output (Build Output API), checked without a
  # Vercel account or secrets: the function config (Node 24, dub1, maxDuration,
  # streaming, cancellation), the static PDF.js files, the bundled server
  # assets, and the function booted as Vercel's Node launcher calls it.
  build-vercel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vercel
      - run: pnpm check:vercel

  # Playwright E2E (Phase 13) against the production build, started without
  # secrets: ask → click a citation chip → the highlight overlay sits on the
  # right page where the stored rects say, at 50/100/200% zoom, desktop and
  # phone. The browser's /api/* requests are answered from repo fixtures and
  # the SSR documents listing from a local stub (test/e2e/fixtures.ts).
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser build matching the pinned @playwright/test, with its system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Also on success: a test that passed only on its retry is flaky, and the
      # report (with the first attempt's trace) is how that shows.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Applies supabase/migrations to the same Postgres image Supabase hosts
  # (pgvector, anon/authenticated/service_role roles), runs the
  # hybrid_search and quota acceptance checks and the retrieval quality gate. Connects as non-superuser `postgres`,
  # like the hosted SQL Editor.
  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image finishes its own init (roles, extensions schema) after the
      # server first accepts connections, so wait for the Supabase roles.
      - name: Wait for Supabase roles
        run: |
          for i in $(seq 1 60); do
            psql -tAc "select 1 from pg_roles where rolname = 'service_role'" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          echo "Supabase Postgres did not become ready" >&2
          exit 1

      - name: Apply migrations
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: hybrid_search acceptance check
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/hybrid_search.sql
      - name: Check hybrid_search_bge_m3
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/hybrid_search_bge_m3.sql

      - name: usage quota acceptance check
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/usage_quota.sql

      - name: per-minute quota acceptance check
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/burst_quota.sql

      # The retrieval quality gate (ADR-0008): the real corpus and golden-question
      # embeddings from test/fixtures/retrieval-corpus.json.gz, hybrid_search_bge_m3 as
      # migrated above, compared with docs/evals/retrieval-baseline.json. No API
      # keys; any drop in recall@k, MRR or nDCG@5 fails.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retrieval gate
        run: pnpm eval:retrieval --install
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
